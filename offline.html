<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060d18">
<title>KIGGS — offline</title>
<style>
:root {
    color-scheme: dark;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #060d18;
    color: #f5f7fb;
}
body {
    min-height: 100dvh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        radial-gradient(circle at 20% 20%, rgba(22, 58, 138, 0.32), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(242, 211, 43, 0.12), transparent 50%),
        #060d18;
}
main {
    width: 100%;
    max-width: 380px;
    padding: 32px 26px;
    text-align: center;
    border-radius: 22px;
    background: rgba(14, 24, 42, 0.68);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
}
h1 {
    margin: 0 0 10px;
    font-size: 1.9rem;
    letter-spacing: 0.14em;
    color: #f2d32b;
}
p {
    margin: 0 0 22px;
    line-height: 1.55;
    color: rgba(226, 232, 240, 0.72);
    font-size: 0.95rem;
}
button {
    appearance: none;
    border: 1px solid rgba(242, 211, 43, 0.38);
    background: rgba(242, 211, 43, 0.14);
    color: #f5f7fb;
    font: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
}
button:hover {
    background: rgba(242, 211, 43, 0.24);
    transform: translateY(-1px);
}
</style>
</head>
<body>
<main>
    <h1>KIGGS</h1>
    <p>Momentálně nejsi připojený k internetu. Zkus stránku znovu načíst.</p>
    <button type="button" onclick="location.reload()">Zkusit znovu</button>
</main>
</body>
</html>
