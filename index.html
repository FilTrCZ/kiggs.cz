<style>
:root {
    --bg: #060d18;
    --bg-elevated: rgba(14, 24, 42, 0.62);
    --border-subtle: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(255, 255, 255, 0.22);
    --text-primary: #f5f7fb;
    --text-secondary: rgba(226, 232, 240, 0.64);
    --accent: #f2d32b;
    --accent-soft: rgba(242, 211, 43, 0.16);
    --radius-card: 18px;
    --radius-portrait: 28px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    color-scheme: dark;
    background-color: var(--bg);
}

body {
    min-height: 100dvh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    background-color: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
}

/* Ambient nocturnal backdrop */
.ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.ambient::before,
.ambient::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.45;
}

.ambient::before {
    width: min(62vw, 640px);
    height: min(62vw, 640px);
    top: -18%;
    left: -12%;
    background: radial-gradient(circle, rgba(22, 58, 138, 0.85) 0%, rgba(11, 22, 48, 0) 72%);
}

.ambient::after {
    width: min(52vw, 520px);
    height: min(52vw, 520px);
    bottom: -22%;
    right: -10%;
    background: radial-gradient(circle, rgba(242, 211, 43, 0.20) 0%, rgba(15, 36, 74, 0.35) 45%, rgba(6, 13, 24, 0) 75%);
}

/* Subtle film grain to prevent gradient banding */
.grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Main layout */
.page {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: clamp(28px, 5vw, 56px) clamp(20px, 4vw, 40px);
    display: grid;
    grid-template-columns: minmax(290px, 410px) minmax(0, 1fr);
    align-items: center;
    gap: clamp(32px, 5vw, 68px);
}

/* Portrait stage */
.portrait-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-portrait);
    overflow: hidden;
    background: #071024;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(242, 211, 43, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    isolation: isolate;
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.55s ease;
}

.portrait-stage:hover {
    transform: translateY(-3px);
    box-shadow:
        0 38px 85px rgba(0, 0, 0, 0.65),
        0 0 42px rgba(242, 211, 43, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
}

.portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

.portrait-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 46% 45%, transparent 52%, rgba(6, 13, 24, 0.42) 100%),
        linear-gradient(to top, rgba(6, 13, 24, 0.45) 0%, transparent 28%);
}

/* Pixel-accurate nose boop hotspot locked to portrait coordinates */
.boop-trigger {
    position: absolute;
    left: 48.5%;
    top: 55.5%;
    width: 19%;
    height: 17%;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 5;
    -webkit-tap-highlight-color: transparent;
}

.boop-trigger:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
}

.boop-ripple {
    position: absolute;
    left: 48.5%;
    top: 55.5%;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid rgba(242, 211, 43, 0.85);
    box-shadow: 0 0 18px rgba(242, 211, 43, 0.45);
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
}

.boop-ripple.is-active {
    animation: boopPulse 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.boop-toast {
    position: absolute;
    left: 48.5%;
    top: 39%;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(8, 15, 28, 0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(242, 211, 43, 0.38);
    color: var(--text-primary);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 6px) scale(0.92);
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.22s;
    pointer-events: none;
    z-index: 6;
}

.boop-toast.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -6px) scale(1);
}

/* Ultra-stealthy secret button hidden in dark portrait corner */
.secret-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.64rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.14);
    background: transparent;
    border: 1px solid transparent;
    transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease, box-shadow 0.3s ease;
    -webkit-tap-highlight-color: transparent;
}

.secret-btn:hover,
.secret-btn:active {
    color: var(--accent);
    background: rgba(6, 13, 24, 0.74);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-color: rgba(242, 211, 43, 0.42);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
}

.secret-btn:focus-visible {
    color: var(--accent);
    background: rgba(6, 13, 24, 0.74);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

/* Content column */
.content {
    display: flex;
    flex-direction: column;
    gap: 28px;
}

.identity {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

h1 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: clamp(2.6rem, 5vw, 3.6rem);
    font-weight: 700;
    letter-spacing: 0.14em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 15%, #cfd8e8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.slogan-row {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    font-weight: 400;
    color: var(--text-secondary);
}

.slogan-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px rgba(242, 211, 43, 0.75);
    flex-shrink: 0;
}

.breathe {
    display: inline-block;
    animation: organicBreathe 5.5s ease-in-out infinite;
}

/* Links stack */
.links-section {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.link-btn {
    --glow: rgba(242, 211, 43, 0.25);
    --accent-border: rgba(255, 255, 255, 0.24);
    --mx: 50%;
    --my: 50%;

    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 13px 18px 13px 14px;
    border-radius: var(--radius-card);
    text-decoration: none;
    color: var(--text-primary);
    background: var(--bg-elevated);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border-subtle);
    box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    overflow: hidden;
    transition:
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.3s ease,
        background-color 0.3s ease,
        box-shadow 0.3s ease;
    -webkit-tap-highlight-color: transparent;
}

/* Cursor spotlight overlay */
.link-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(240px circle at var(--mx) var(--my), var(--glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.32s ease;
    pointer-events: none;
}

.link-btn:hover {
    transform: translateY(-3px);
    background: rgba(18, 30, 52, 0.78);
    border-color: var(--accent-border);
    box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.42),
        0 0 24px -6px var(--glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.link-btn:hover::before {
    opacity: 1;
}

.link-btn:active {
    transform: translateY(-1px) scale(0.985);
}

.link-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

/* Platform badge */
.icon-badge {
    position: relative;
    z-index: 1;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    color: #ffffff;
    box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.link-btn:hover .icon-badge {
    transform: scale(1.06);
}

.link-icon {
    width: 21px;
    height: 21px;
    display: block;
}

.link-meta {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
}

.link-title {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-primary);
}

.link-sub {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.link-arrow {
    position: relative;
    z-index: 1;
    width: 18px;
    height: 18px;
    color: rgba(255, 255, 255, 0.38);
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease;
}

.link-btn:hover .link-arrow {
    transform: translate(3px, -3px);
    color: rgba(255, 255, 255, 0.92);
}

/* Platform color signatures */
.instagram {
    --glow: rgba(214, 41, 118, 0.24);
    --accent-border: rgba(250, 126, 30, 0.42);
}
.instagram .icon-badge {
    background: linear-gradient(135deg, #feda75 0%, #fa7e1e 28%, #d62976 62%, #962fbf 85%, #4f5bd5 100%);
}

.telegram {
    --glow: rgba(56, 189, 248, 0.24);
    --accent-border: rgba(72, 200, 255, 0.44);
}
.telegram .icon-badge {
    background: linear-gradient(135deg, #0077b6 0%, #38c6ff 100%);
}

.jsempes {
    --glow: rgba(180, 118, 58, 0.26);
    --accent-border: rgba(196, 134, 72, 0.46);
}
.jsempes .icon-badge {
    background: linear-gradient(135deg, #52301e 0%, #8a5730 55%, #b8783a 100%);
}

.pobar {
    --glow: rgba(242, 211, 43, 0.24);
    --accent-border: rgba(242, 211, 43, 0.46);
}
.pobar .icon-badge {
    background: linear-gradient(135deg, #555b62 0%, #9b8c2a 40%, #f2d32b 100%);
    color: #101620;
}

.pawtrail {
    --glow: rgba(52, 211, 153, 0.22);
    --accent-border: rgba(242, 211, 43, 0.48);
}
.pawtrail .icon-badge {
    background: linear-gradient(135deg, #0f2942 0%, #1d5c5c 52%, #f2d32b 100%);
    color: #ffffff;
}
.pawtrail.is-locked {
    opacity: 0.76;
    border-style: dashed;
    border-color: rgba(242, 211, 43, 0.24);
    cursor: default;
}
.pawtrail.is-locked:hover {
    transform: none;
    box-shadow: 0 10px 28px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.08);
    border-color: rgba(242, 211, 43, 0.36);
}
.pawtrail.is-locked:hover .icon-badge {
    transform: none;
}
.pawtrail.is-locked:hover .link-arrow {
    transform: none;
    color: rgba(242, 211, 43, 0.78);
}
.pawtrail.is-locked .link-arrow {
    color: rgba(242, 211, 43, 0.65);
}

.trail-toast {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    padding: 11px 18px;
    border-radius: 999px;
    background: rgba(8, 15, 28, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(242, 211, 43, 0.42);
    color: var(--text-primary);
    font-size: 0.86rem;
    font-weight: 500;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 10px);
    transition: opacity 0.22s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.22s;
    pointer-events: none;
    z-index: 20;
    text-align: center;
    max-width: calc(100vw - 32px);
}
.trail-toast.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

footer {
    margin-top: 4px;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: rgba(226, 232, 240, 0.34);
}

/* Animations */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes organicBreathe {
    0%, 100% { letter-spacing: 0.14em; opacity: 0.76; }
    50% { letter-spacing: 0.20em; opacity: 1; }
}

@keyframes boopPulse {
    0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(0.45);
    }
    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.8);
    }
}

.fade-up {
    opacity: 0;
    animation: fadeUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.delay-1 { animation-delay: 0.08s; }
.delay-2 { animation-delay: 0.16s; }
.delay-3 { animation-delay: 0.24s; }
.delay-4 { animation-delay: 0.32s; }
.delay-5 { animation-delay: 0.40s; }

/* Mobile & Tablet layout */
@media (max-width: 860px) {
    .page {
        grid-template-columns: 1fr;
        max-width: 460px;
        padding: 28px 0 max(36px, env(safe-area-inset-bottom));
        gap: 0;
        align-content: start;
    }

    .portrait-stage:hover {
        transform: none;
        box-shadow:
            0 30px 70px rgba(0, 0, 0, 0.58),
            0 0 0 1px rgba(242, 211, 43, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .portrait-vignette {
        background:
            radial-gradient(circle at 46% 42%, transparent 45%, rgba(6, 13, 24, 0.42) 100%),
            linear-gradient(to top, var(--bg) 0%, rgba(6, 13, 24, 0.72) 18%, transparent 44%);
    }

    .content {
        position: relative;
        z-index: 3;
        margin-top: -54px;
        padding: 0 20px;
        gap: 24px;
    }

    .identity {
        align-items: center;
        text-align: center;
    }

    h1 {
        font-size: 2.55rem;
    }

    .links-section {
        gap: 12px;
    }

    footer {
        text-align: center;
        margin-top: 8px;
    }
}

@media (max-width: 500px) {
    .page {
        padding-top: 0;
    }

    .portrait-stage {
        border-radius: 0;
        border: 0;
        box-shadow: none;
    }

    .portrait-stage:hover {
        box-shadow: none;
    }

    .secret-btn {
        top: max(14px, env(safe-area-inset-top));
        left: 14px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .fade-up { opacity: 1; animation: none; }
    .breathe { animation: none; }
    .portrait-stage, .link-btn, .link-btn::before, .icon-badge, .link-arrow, .boop-toast { transition: none; }
    .boop-ripple.is-active { animation: none; }
}
</style>
</head>

<body>

<div class="ambient" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="page">
    <div class="portrait-stage fade-up">
        <img class="portrait-img" src="images/background.webp" alt="KIGGS" width="2048" height="2048" fetchpriority="high" decoding="async">
        <div class="portrait-vignette" aria-hidden="true"></div>
        <a href="secret.html" class="secret-btn" aria-label="Tajné tlačítko">secret</a>
        <div class="boop-ripple" id="boop-ripple" aria-hidden="true"></div>
        <button class="boop-trigger" id="boop-trigger" type="button" aria-label="Boop"></button>
        <div class="boop-toast" id="boop-toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div class="content">
        <header class="identity fade-up delay-1">
            <h1>KIGGS</h1>
            <div class="slogan-row">
                <span class="slogan-dot" aria-hidden="true"></span>
                <span class="breathe">Woof. Woof.</span>
            </div>
        </header>

        <nav class="links-section" aria-label="Odkazy">
            <a href="https://instagram.com/kiggscz" target="_blank" rel="noopener noreferrer" class="link-btn instagram fade-up delay-2">
                <span class="icon-badge" aria-hidden="true">
                    <svg class="link-icon" focusable="false" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"></rect>
                        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        <circle cx="17.5" cy="6.5" r="1.25" fill="currentColor"></circle>
                    </svg>
                </span>
                <span class="link-meta">
                    <span class="link-title">Instagram</span>
                    <span class="link-sub">@kiggscz</span>
                </span>
                <svg class="link-arrow" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 17 17 7"></path>
                    <path d="M8 7h9v9"></path>
                </svg>
            </a>

            <a href="https://t.me/KiggsCZ" target="_blank" rel="noopener noreferrer" class="link-btn telegram fade-up delay-3">

<script src="lov/config.js"></script>
<script>
const boopTrigger = document.getElementById("boop-trigger");
const boopToast = document.getElementById("boop-toast");
const boopRipple = document.getElementById("boop-ripple");
const boopMessages = ["Boop!", "Boop!", "Woof!", "Boop! 🐾"];
let boopCount = 0;
try { boopCount = Number(localStorage.getItem("kiggs_boops") || 0); } catch {}
let boopTimer;

boopTrigger.addEventListener("click", () => {
    clearTimeout(boopTimer);
    if (navigator.vibrate) navigator.vibrate(15);

    boopRipple.classList.remove("is-active");
    boopToast.classList.remove("is-visible");
    boopToast.textContent = "";

    const msg = boopMessages[boopCount % boopMessages.length];
    boopCount += 1;
    try { localStorage.setItem("kiggs_boops", String(boopCount)); } catch {}

    window.requestAnimationFrame(() => {
        void boopRipple.offsetWidth;
        boopRipple.classList.add("is-active");
        boopToast.textContent = msg;
        boopToast.classList.add("is-visible");
    });

    boopTimer = window.setTimeout(() => {
        boopToast.classList.remove("is-visible");
        boopToast.textContent = "";
    }, 1500);
});

if (window.matchMedia("(pointer: fine)").matches) {
    document.querySelectorAll(".link-btn").forEach((card) => {
        card.addEventListener("pointermove", (e) => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
            card.style.setProperty("--my", `${e.clientY - rect.top}px`);
        });
    });
}

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
}

/* Paw Trail (Kiggs × Pobar) — dálkové odemčení z administrace */
(() => {
    const btn = document.getElementById("pawtrail-btn");
    const sub = document.getElementById("pawtrail-sub");
    const icon = document.getElementById("pawtrail-state-icon");
    const toast = document.getElementById("trail-toast");
    const cfg = window.KIGGS_LOV_CONFIG || {};

    let trailOpen = Boolean(cfg.DEFAULT_TRAIL_ENABLED);
    let teaserMessage = cfg.DEFAULT_TEASER_MESSAGE || "Paw Trail (Kiggs × Pobar) startuje už brzy 🐾";
    let toastTimer;

    function applyTrailState(isOpen) {
        trailOpen = Boolean(isOpen);
        btn.classList.toggle("is-locked", !trailOpen);
        if (trailOpen) {
            btn.removeAttribute("aria-disabled");
            sub.textContent = "Kiggs × Pobar • Lov rozhleden";
            icon.innerHTML = '<path d="M7 17 17 7"></path><path d="M8 7h9v9"></path>';
        } else {
            btn.setAttribute("aria-disabled", "true");
            sub.textContent = "Kiggs × Pobar • Již brzy";
            icon.innerHTML = '<rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>';
        }
    }

    btn.addEventListener("click", (e) => {
        if (!trailOpen) {
            e.preventDefault();
            clearTimeout(toastTimer);
            toast.textContent = teaserMessage;
            toast.classList.add("is-visible");
            toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
        }
    });

    if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) {
        const url = `${cfg.SUPABASE_URL.replace(/\/+$/, "")}/rest/v1/rpc/get_trail_status`;
        const headers = {
            "Content-Type": "application/json",
            "apikey": cfg.SUPABASE_ANON_KEY
        };
        if (!cfg.SUPABASE_ANON_KEY.startsWith("sb_publishable_")) {
            headers["Authorization"] = `Bearer ${cfg.SUPABASE_ANON_KEY}`;
        }
        fetch(url, {
            method: "POST",
            headers,
            body: "{}"
        })
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => {
                if (!data) return;
                if (data.teaser_message) teaserMessage = data.teaser_message;
                applyTrailState(Boolean(data.enabled));
            })
            .catch(() => {});
    } else {
        try {
            const localEnabled = localStorage.getItem("kiggs_trail_local_enabled");
            const localTeaser = localStorage.getItem("kiggs_trail_local_teaser");
            if (localTeaser) teaserMessage = localTeaser;
            if (localEnabled === "1") applyTrailState(true);
            else applyTrailState(false);
        } catch {
            applyTrailState(false);
        }
    }

    /* Skrytý vstup do Velína smečky pro admina v nainstalované appce (5× klepnutí na patičku) */
    const footerEl = document.getElementById("site-footer");
    if (footerEl) {
        let taps = 0;
        let tapTimer;
        footerEl.addEventListener("click", () => {
            taps += 1;
            clearTimeout(tapTimer);
            if (taps >= 5) {
                taps = 0;
                window.location.href = "lov/admin.html";
                return;
            }
            tapTimer = window.setTimeout(() => { taps = 0; }, 1600);
        });
    }
})();
</script>
