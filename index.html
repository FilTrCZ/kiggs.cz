* {

body {
    font-family: 'Inter', sans-serif;
    color: #ffffff;

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes organicBreathe {
    0% { letter-spacing: 3px; opacity: 0.9; }
    50% { letter-spacing: 4px; opacity: 1; }
    100% { letter-spacing: 3px; opacity: 0.9; }
}

.fade-up { opacity: 0; animation: fadeUp 1.2s ease forwards; }
.delay-1 { animation-delay: 0.3s; }
.delay-2 { animation-delay: 0.6s; }
.delay-3 { animation-delay: 0.9s; }
.delay-4 { animation-delay: 1.2s; }

.breathe { display: inline-block; animation: organicBreathe 5.5s ease-in-out infinite; }

.hero {
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

h1 { font-size: 3rem; letter-spacing: 6px; font-weight: 600; }

.slogan { margin-top: 15px; font-size: 1rem; font-weight: 400; }

.links-section {
    margin-top: -30px;
    padding: 30px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.link-btn {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    color: #ffffff;
    transition: transform 0.3s ease, box-shadow 0.3s ease, letter-spacing 0.3s ease;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

.link-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translateY(-50%);
}

.link-btn:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 20px 45px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
}

.instagram { background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
.telegram { background: #229ED9; }
.jsempes { background: #8a6914; color: #ffffff; font-weight: 600; }
.email { background: #444444; }

.boop-trigger {
    position: fixed;
    top: 55vh;
    left: 50%;
    width: 100px;
    height: 80px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 5;
}

.boop-trigger:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 4px;
}

.boop-toast {
    position: fixed;
    left: 50%;
    top: calc(55vh - 50px);
    padding: 9px 15px;
    border-radius: 999px;
    background: rgba(11,22,35,0.94);
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, -8px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    pointer-events: none;
    z-index: 6;
}

.boop-toast.is-visible {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
}

footer { text-align: center; padding: 40px 20px; font-size: 0.8rem; opacity: 0.4; }

@media (max-width: 768px) {
    body { background: #0b1623; }
    .mobile-banner {
        position: relative;
        height: 42vh;
        background: linear-gradient(rgba(5,10,18,0.6), rgba(5,10,18,0.6)),

    .hero { height: auto; padding: 20px 20px 10px; }
    h1 { font-size: 2.2rem; }
    .links-section { margin-top: 0; padding: 20px 20px 60px; gap: 14px; }
    .boop-trigger { position: absolute; top: 54%; }
    .boop-toast { top: calc(22.7vh - 42px); }
}

<script>
const user = "hello";
const domain = "kiggs.cz";
const email = user + "@" + domain;
document.getElementById("email-link").href = "mailto:" + email;

const boopTrigger = document.getElementById("boop-trigger");
const boopToast = document.getElementById("boop-toast");
let boopTimer;

boopTrigger.addEventListener("click", () => {
    clearTimeout(boopTimer);
    boopToast.classList.remove("is-visible");
    boopToast.textContent = "";

    window.requestAnimationFrame(() => {
        boopToast.textContent = "Boop!";
        boopToast.classList.add("is-visible");
    });

    boopTimer = window.setTimeout(() => {
        boopToast.classList.remove("is-visible");
        boopToast.textContent = "";
    }, 1600);
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
}
</script>
